<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GovVerify favicon</title>
  <desc id="desc">A black document icon with a green folded corner and integrated green verification checkmark.</desc>
  <g transform="translate(16 3) scale(0.52)">
    <!-- Document outline with an open lower-right corner -->
    <path d="M116 18H47C25 18 10 34 10 56V207C10 229 25 244 47 244H77L58 225H47C36 225 29 218 29 207V56C29 45 36 37 47 37H116Z" fill="#111111"/>
    <!-- Folded page corner -->
    <path d="M132 18H142L185 61V76H148C138 76 132 70 132 60Z" fill="#16A085"/>
    <!-- Document text lines -->
    <path d="M49 89H119M49 111H130M49 133H101" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
    <!-- Integrated verification check -->
    <path d="M52 174L78 200L157 122" fill="none" stroke="#16A085" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
